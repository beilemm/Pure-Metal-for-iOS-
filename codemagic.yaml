workflows:
  puremetal-ios:
    name: Pure Metal iOS dylib
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        MIN_IOS: "16.0"
        SRC_DIR: "."       # source files sit in the repo root
        OUT_NAME: "libpuremetal.dylib"
    scripts:
      - name: Check sources exist and contain no AppKit
        script: |
          FILES=$(find "$SRC_DIR" -maxdepth 1 \( -name "*.mm" -o -name "*.m" -o -name "*.cpp" \))
          if [ -z "$FILES" ]; then
            echo "No source files found in $SRC_DIR"
            exit 1
          fi
          if grep -En "AppKit|NSView|NSWindow|NSScreen|NSApplication" $FILES *.h; then
            echo "AppKit code found: use UIKit or CAMetalLayer only"
            exit 1
          fi

      - name: Compile Metal shaders (if any)
        script: |
          mkdir -p build
          METALS=$(find "$SRC_DIR" -maxdepth 1 -name "*.metal")
          if [ -n "$METALS" ]; then
            for f in $METALS; do
              xcrun -sdk iphoneos metal -c "$f" \
                -miphoneos-version-min=$MIN_IOS \
                -o "build/$(basename "$f" .metal).air"
            done
            xcrun -sdk iphoneos metallib build/*.air -o build/default.metallib
          fi

      - name: Build iOS arm64 dylib
        script: |
          mkdir -p build
          FILES=$(find "$SRC_DIR" -maxdepth 1 \( -name "*.mm" -o -name "*.m" -o -name "*.cpp" \))
          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=$MIN_IOS \
            -std=c++20 -fobjc-arc -O2 -fvisibility=hidden \
            -dynamiclib \
            -install_name "@rpath/$OUT_NAME" \
            -framework Metal -framework QuartzCore -framework Foundation \
            $FILES \
            -o "build/$OUT_NAME"

      - name: Ad-hoc code sign
        script: codesign -f -s - "build/$OUT_NAME"

      - name: Verify (platform, size, exported symbols)
        script: |
          vtool -show-build "build/$OUT_NAME"
          vtool -show-build "build/$OUT_NAME" | grep -q "platform IOS"
          ls -lh "build/$OUT_NAME"
          nm -gU "build/$OUT_NAME"
          nm -gU "build/$OUT_NAME" | grep -q "_pm_init"

    artifacts:
      - build/libpuremetal.dylib
      - build/*.metallib
